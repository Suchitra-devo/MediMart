<div class="register-container">

  <div class="overlay">

    <div class="register-card">

      <h1>
        💊 MediMart
      </h1>

      <p class="subtitle">
        Create Your Account
      </p>

      <form
        [formGroup]="registerForm"
        (ngSubmit)="register()"
      >

        <!-- USERNAME -->
        <div class="input-group">

          <label>
            Username
          </label>

          <input
            type="text"
            placeholder="Enter username"
            formControlName="username"
          />

          <small
            *ngIf="
              registerForm
              .get('username')
              ?.touched &&
              registerForm
              .get('username')
              ?.hasError('required')
            "
          >
            Username is required
          </small>

        </div>

        <!-- PHONE -->
        <div class="input-group">

          <label>
            Phone Number
          </label>

          <input
            type="text"
            placeholder="Enter phone number"
            formControlName="phone"
          />

          <small
            *ngIf="
              registerForm
              .get('phone')
              ?.touched &&
              registerForm
              .get('phone')
              ?.hasError('required')
            "
          >
            Phone number is required
          </small>

          <small
            *ngIf="
              registerForm
              .get('phone')
              ?.touched &&
              registerForm
              .get('phone')
              ?.hasError('pattern')
            "
          >
            Enter valid 10 digit number
          </small>

        </div>

        <!-- EMAIL -->
        <div class="input-group">

          <label>
            Email (Optional)
          </label>

          <input
            type="email"
            placeholder="Enter email"
            formControlName="email"
          />

        </div>

        <!-- ADDRESS -->
        <div class="input-group">

          <label>
            Address (Optional)
          </label>

          <textarea
            rows="3"
            placeholder="Enter address"
            formControlName="address"
          ></textarea>

        </div>

        <!-- PASSWORD -->
        <div class="input-group">

          <label>
            Password
          </label>

          <input
            [type]="
              hidePassword
              ? 'password'
              : 'text'
            "
            placeholder="Enter password"
            formControlName="password"
          />

          <small
            *ngIf="
              registerForm
              .get('password')
              ?.touched &&
              registerForm
              .get('password')
              ?.hasError('required')
            "
          >
            Password is required
          </small>

        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="input-group">

          <label>
            Confirm Password
          </label>

          <input
            [type]="
              hideConfirmPassword
              ? 'password'
              : 'text'
            "
            placeholder="Re-enter password"
            formControlName="confirmPassword"
          />

          <small
            *ngIf="
              registerForm
              .get('confirmPassword')
              ?.touched &&
              registerForm
              .get('confirmPassword')
              ?.hasError('required')
            "
          >
            Confirm password is required
          </small>

          <small
            *ngIf="
              registerForm.errors
              ?.['passwordMismatch']
            "
          >
            Passwords do not match
          </small>

        </div>

        <!-- SHOW PASSWORD -->
        <div class="show-password">

          <input
            type="checkbox"
            (change)="
              hidePassword =
              !hidePassword;

              hideConfirmPassword =
              !hideConfirmPassword
            "
          />

          <span>
            Show Passwords
          </span>

        </div>

        <!-- ERROR -->
        <p
          class="error"
          *ngIf="errorMessage"
        >
          {{ errorMessage }}
        </p>

        <!-- BUTTON -->
        <button
          type="submit"
          class="register-btn"
        >
          Register
        </button>

      </form>

      <!-- LOGIN -->
      <p class="login-text">

        Already have an account?

        <a
          routerLink="/login"
          class="login-link"
        >
          Login
        </a>

      </p>

    </div>

  </div>

</div>
