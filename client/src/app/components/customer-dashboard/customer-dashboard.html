<app-header></app-header>
<div class="layout">

  <!-- LEFT SIDEBAR -->
  <div class="sidebar">

    <h2>💊 Categories</h2>

    <ul>

      <li
        *ngFor="let cat of categories"
        [class.active]="cat === selectedCategory"
        (click)="selectCategory(cat)"
      >
        {{ cat }}
      </li>

    </ul>

  </div>

  <!-- RIGHT CONTENT -->
  <div class="content">

    <!-- HEADER -->
    <div class="header">

      <div>
        <h2>Available Medicines</h2>
        <p class="sub-text">
          Browse and search medicines easily
        </p>
      </div>

      <input
        type="text"
        placeholder="Search medicines..."
        [(ngModel)]="searchText"
        (input)="applyFilters()"
      />

    </div>

    <!-- STATS BAR (NEW ENHANCEMENT) -->
    <div class="stats-bar">

      <div class="stat">
        <span class="label">Total</span>
        <span class="value">{{ medicines.length }}</span>
      </div>

      <div class="stat">
        <span class="label">Category</span>
        <span class="value">{{ selectedCategory }}</span>
      </div>

    </div>

    <!-- GRID -->
    <div class="medicine-grid">

      <div class="medicine-card" *ngFor="let med of medicines">

        <!-- CARD HEADER -->
        <div class="card-header">

          <h3>{{ med.name }}</h3>

          <span class="tag">
            {{ med.category }}
          </span>

        </div>

        <!-- DESCRIPTION -->
        <p class="desc">
          {{ med.composition }}
        </p>

        <!-- FOOTER -->
        <div class="card-footer">

          <span class="price">
            ₹{{ med.price }}
          </span>

          

        </div>

      </div>

    </div>

  </div>

</div>
